<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya AI · 内容审核</title>
<style>
:root {
    --bg: #07070c; --card: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.09);
    --text: #f2f2f7; --muted: #9a9aac; --p1: #8a5cf5; --p2: #6d7cff;
    --green: #34d399; --red: #f87171; --amber: #fbbf24; --radius: 18px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; padding:20px; }
a { text-decoration:none; color:inherit; }

nav { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border:1px solid var(--border); border-radius:var(--radius); background:var(--card); margin-bottom:20px; }
.nav-logo { font-size:18px; font-weight:700; display:flex; align-items:center; gap:8px; }
.nav-logo .dot { width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,var(--p1),var(--p2)); display:flex; align-items:center; justify-content:center; font-size:14px; }

.token-bar { display:flex; gap:10px; align-items:center; }
.token-bar input { background:rgba(0,0,0,0.3); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:10px; font-size:13px; width:220px; font-family:monospace; }
.token-bar button { background:linear-gradient(135deg,var(--p1),var(--p2)); border:none; color:#fff; padding:8px 16px; border-radius:10px; font-size:13px; cursor:pointer; font-weight:600; }
.token-bar button:hover { opacity:.9; }

.filters { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.filter { padding:8px 16px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer; font-size:13px; transition:all .2s; }
.filter.active { background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; border-color:transparent; }
.filter .count { margin-left:6px; opacity:.7; font-size:11px; }

.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:18px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:transform .2s, border-color .2s; }
.card:hover { transform:translateY(-2px); border-color:rgba(138,92,245,0.4); }
.card-cover { width:100%; aspect-ratio:9/16; object-fit:cover; background:#1a1a2e; }
.card-body { padding:14px; }
.card-title { font-size:16px; font-weight:700; margin-bottom:6px; }
.card-desc { font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.tag { font-size:11px; padding:3px 8px; border-radius:6px; background:rgba(138,92,245,0.15); color:var(--p1); }
.card-meta { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); }
.status { padding:3px 10px; border-radius:6px; font-size:11px; font-weight:600; }
.status.pending_review { background:rgba(251,191,36,0.15); color:var(--amber); }
.status.approved { background:rgba(52,211,153,0.15); color:var(--green); }
.status.rejected { background:rgba(248,113,113,0.15); color:var(--red); }

/* modal */
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:100; align-items:center; justify-content:center; padding:20px; }
.modal.show { display:flex; }
.modal-box { background:#12121a; border:1px solid var(--border); border-radius:var(--radius); width:100%; max-width:900px; max-height:90vh; overflow-y:auto; }
.modal-head { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:#12121a; z-index:1; }
.modal-head h2 { font-size:18px; }
.modal-close { background:none; border:none; color:var(--muted); font-size:24px; cursor:pointer; }
.modal-body { padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.modal-video { width:100%; border-radius:12px; background:#000; }
.modal-cover { width:100%; border-radius:12px; }
.modal-field { margin-bottom:14px; }
.modal-field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
.modal-field input, .modal-field textarea { width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:10px; font-size:14px; font-family:inherit; }
.modal-field textarea { min-height:70px; resize:vertical; }
.modal-tags { display:flex; flex-wrap:wrap; gap:6px; }
.modal-actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
.btn { padding:10px 18px; border-radius:10px; border:none; cursor:pointer; font-size:14px; font-weight:600; transition:opacity .2s; }
.btn:hover { opacity:.85; }
.btn-approve { background:var(--green); color:#000; }
.btn-reject { background:var(--red); color:#fff; }
.btn-download { background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; }
.btn-save { background:var(--p2); color:#fff; }
.btn:disabled { opacity:.5; cursor:not-allowed; }

.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:10px; font-size:14px; z-index:200; display:none; }
.toast.show { display:block; }
.toast.success { background:var(--green); color:#000; }
.toast.error { background:var(--red); color:#fff; }

@media (max-width: 700px) { .modal-body { grid-template-columns:1fr; } }
</style>
</head>
<body>

<nav>
  <div class="nav-logo"><span class="dot">M</span> Maya AI · 内容审核</div>
  <div class="token-bar">
    <input id="tokenInput" placeholder="Admin Token" type="password">
    <button onclick="saveToken()">连接</button>
  </div>
</nav>

<div class="filters" id="filters">
  <div class="filter active" data-status="">全部 <span class="count" id="countAll">0</span></div>
  <div class="filter" data-status="pending_review">待审核 <span class="count" id="countPending">0</span></div>
  <div class="filter" data-status="approved">已通过 <span class="count" id="countApproved">0</span></div>
  <div class="filter" data-status="rejected">已拒绝 <span class="count" id="countRejected">0</span></div>
</div>

<div class="grid" id="grid"></div>

<!-- modal -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">审核详情</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div>
        <video id="modalVideo" class="modal-video" controls playsinline></video>
        <div style="margin-top:10px; font-size:12px; color:var(--muted);">
          <span id="modalPlatform"></span> · <span id="modalDate"></span>
        </div>
      </div>
      <div>
        <div class="modal-field">
          <label>标题</label>
          <input id="fTitle">
        </div>
        <div class="modal-field">
          <label>描述</label>
          <textarea id="fDesc"></textarea>
        </div>
        <div class="modal-field">
          <label>标签（逗号分隔）</label>
          <input id="fTags">
        </div>
        <div class="modal-field">
          <label>CTA</label>
          <input id="fCta">
        </div>
        <div class="modal-actions">
          <button class="btn btn-save" onclick="saveEdit()">保存修改</button>
          <button class="btn btn-download" onclick="downloadPkg()">下载发布包</button>
          <button class="btn btn-approve" onclick="approve()">通过</button>
          <button class="btn btn-reject" onclick="reject()">拒绝</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? location.origin  // use same port as the page when running locally
    : 'https://api.gudaoqihuo.com';

let token = new URLSearchParams(location.search).get('token') || localStorage.getItem('maya_admin_token') || '';
let currentPost = null;
let currentStatus = '';

if (token) document.getElementById('tokenInput').value = token;

function saveToken() {
  token = document.getElementById('tokenInput').value.trim();
  localStorage.setItem('maya_admin_token', token);
  loadPosts();
}

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2500);
}

async function api(path, opts={}) {
  const url = `${API}${path}${path.includes('?') ? '&' : '?'}token=${encodeURIComponent(token)}`;
  const res = await fetch(url, opts);
  if (res.status === 401) { toast('Token 无效', 'error'); throw new Error('unauthorized'); }
  return res.json();
}

async function loadPosts() {
  if (!token) { toast('请先输入 Token', 'error'); return; }
  try {
    const data = await api(`/api/publish/posts${currentStatus ? '?status=' + currentStatus : ''}`);
    const all = await api('/api/publish/posts');
    document.getElementById('countAll').textContent = all.total;
    document.getElementById('countPending').textContent = all.posts.filter(p => p.status === 'pending_review').length;
    document.getElementById('countApproved').textContent = all.posts.filter(p => p.status === 'approved').length;
    document.getElementById('countRejected').textContent = all.posts.filter(p => p.status === 'rejected').length;
    renderPosts(data.posts);
  } catch (e) { console.error(e); }
}

function renderPosts(posts) {
  const grid = document.getElementById('grid');
  if (posts.length === 0) {
    grid.innerHTML = '<div style="color:var(--muted); padding:40px; text-align:center; grid-column:1/-1;">暂无内容</div>';
    return;
  }
  grid.innerHTML = posts.map(p => `
    <div class="card" onclick="openPost('${p.post_id}')">
      <img class="card-cover" src="${API}/api/publish/posts/${p.post_id}/cover" loading="lazy">
      <div class="card-body">
        <div class="card-title">${p.title || '(无标题)'}</div>
        <div class="card-desc">${p.description || ''}</div>
        <div class="card-tags">${(p.hashtags || []).slice(0,4).map(t => `<span class="tag">#${t}</span>`).join('')}</div>
        <div class="card-meta">
          <span>${p.platform || ''}</span>
          <span class="status ${p.status}">${statusLabel(p.status)}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function statusLabel(s) {
  return { pending_review: '待审核', approved: '已通过', rejected: '已拒绝' }[s] || s;
}

function openPost(postId) {
  api(`/api/publish/posts/${postId}`).then(p => {
    currentPost = p;
    document.getElementById('modalTitle').textContent = p.title || '审核详情';
    document.getElementById('modalVideo').src = `${API}/api/publish/posts/${postId}/video`;
    document.getElementById('modalPlatform').textContent = p.platform || '';
    document.getElementById('modalDate').textContent = (p.created_at || '').slice(0, 16).replace('T', ' ');
    document.getElementById('fTitle').value = p.title || '';
    document.getElementById('fDesc').value = p.description || '';
    document.getElementById('fTags').value = (p.hashtags || []).join(', ');
    document.getElementById('fCta').value = p.cta || '';
    document.getElementById('modal').classList.add('show');
  });
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modalVideo').pause();
}

async function saveEdit() {
  if (!currentPost) return;
  const fields = {
    title: document.getElementById('fTitle').value,
    description: document.getElementById('fDesc').value,
    hashtags: document.getElementById('fTags').value.split(',').map(s => s.trim()).filter(Boolean),
    cta: document.getElementById('fCta').value,
  };
  await api(`/api/publish/posts/${currentPost.post_id}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(fields),
  });
  toast('已保存');
  loadPosts();
}

async function approve() {
  if (!currentPost) return;
  await api(`/api/publish/posts/${currentPost.post_id}/approve`, { method: 'POST' });
  toast('已通过 ✅');
  closeModal();
  loadPosts();
}

async function reject() {
  if (!currentPost) return;
  const reason = prompt('拒绝原因（可选）:') || '';
  await api(`/api/publish/posts/${currentPost.post_id}/reject`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ reason }),
  });
  toast('已拒绝');
  closeModal();
  loadPosts();
}

function downloadPkg() {
  if (!currentPost) return;
  window.open(`${API}/api/publish/posts/${currentPost.post_id}/package?token=${encodeURIComponent(token)}`, '_blank');
}

// filter clicks
document.querySelectorAll('.filter').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('.filter').forEach(f => f.classList.remove('active'));
    el.classList.add('active');
    currentStatus = el.dataset.status;
    loadPosts();
  };
});

// close modal on backdrop click
document.getElementById('modal').onclick = (e) => {
  if (e.target.id === 'modal') closeModal();
};

loadPosts();
</script>
</body>
</html>
