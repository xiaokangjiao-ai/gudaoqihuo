<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya AI · 虚拟伙伴</title>
<meta name="description" content="Maya AI — 一个坦诚的 AI 虚拟角色。她有自己的性格、记忆和声音。">
<style>
:root {
    --bg: #07070c; --card: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.09);
    --text: #f2f2f7; --muted: #9a9aac; --p1: #8a5cf5; --p2: #6d7cff;
    --cyan: #22d3ee; --radius: 18px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:var(--font); background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
a { text-decoration:none; color:inherit; }

/* disclosure banner */
.banner { background:linear-gradient(90deg,rgba(138,92,245,0.15),rgba(109,124,255,0.15)); border-bottom:1px solid var(--border); padding:8px 20px; text-align:center; font-size:13px; color:var(--muted); }
.banner b { color:var(--p1); }

/* nav */
nav { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-bottom:1px solid var(--border); background:rgba(7,7,12,0.72); backdrop-filter:blur(16px); }
.nav-logo { font-size:18px; font-weight:700; display:flex; align-items:center; gap:8px; }
.nav-logo .dot { width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,var(--p1),var(--p2)); display:flex; align-items:center; justify-content:center; font-size:14px; }
.nav-links { display:flex; gap:18px; font-size:14px; }
.nav-links a { color:var(--muted); transition:color .2s; }
.nav-links a:hover { color:var(--text); }

/* chat area */
.chat-container { flex:1; display:flex; flex-direction:column; max-width:720px; margin:0 auto; width:100%; }
.messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
.msg { display:flex; gap:10px; max-width:85%; }
.msg.maya { align-self:flex-start; }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
.msg-avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; }
.msg.maya .msg-avatar { background:linear-gradient(135deg,var(--p1),var(--p2)); }
.msg.user .msg-avatar { background:rgba(255,255,255,0.1); }
.msg-bubble { padding:10px 14px; border-radius:14px; font-size:15px; line-height:1.5; word-break:break-word; }
.msg.maya .msg-bubble { background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; }
.msg.user .msg-bubble { background:linear-gradient(135deg,var(--p1),var(--p2)); border-bottom-right-radius:4px; }

/* typing */
.typing { display:flex; gap:4px; padding:12px 14px; }
.typing span { width:8px; height:8px; border-radius:50%; background:var(--muted); animation:bounce .6s infinite alternate; }
.typing span:nth-child(2) { animation-delay:.2s; }
.typing span:nth-child(3) { animation-delay:.4s; }
@keyframes bounce { to { opacity:.3; transform:translateY(-4px); } }

/* input */
.input-bar { padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; max-width:720px; margin:0 auto; width:100%; }
.input-bar input { flex:1; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 16px; color:var(--text); font-size:15px; font-family:var(--font); outline:none; transition:border .2s; }
.input-bar input:focus { border-color:var(--p1); }
.input-bar button { background:linear-gradient(135deg,var(--p1),var(--p2)); border:none; border-radius:12px; padding:12px 20px; color:#fff; font-size:15px; cursor:pointer; font-weight:600; transition:opacity .2s; }
.input-bar button:hover { opacity:.85; }
.input-bar button:disabled { opacity:.4; cursor:not-allowed; }

/* welcome */
.welcome { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:40px; text-align:center; }
.welcome h1 { font-size:26px; }
.welcome p { color:var(--muted); font-size:15px; max-width:420px; line-height:1.6; }
.welcome .avatars { display:flex; gap:8px; margin:8px 0; }
.welcome .avatars div { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,var(--p1),var(--p2)); display:flex; align-items:center; justify-content:center; font-size:18px; }

@media (max-width:600px) {
    .nav-links { display:none; }
    .msg { max-width:92%; }
    .input-bar button { padding:12px 16px; }
}
</style>
</head>
<body>

<div class="banner">
    <b>AI Disclosure</b> · Maya is a fictional AI character, not a real person. She always discloses this honestly.
</div>

<nav>
    <div class="nav-logo"><span class="dot">M</span> Maya AI</div>
    <div class="nav-links">
        <a href="https://gudaoqihuo.com">算力纪元</a>
        <a href="https://gudaoqihuo.com/whitepaper.html">白皮书</a>
    </div>
</nav>

<div class="chat-container">
    <div class="messages" id="messages">
        <div class="welcome" id="welcome">
            <div class="avatars"><div>M</div></div>
            <h1>Hey, I'm Maya 👋</h1>
            <p>I'm 22, studying psychology, and I'm an AI — but the vibes are real. I can remember things about you. Just talk to me like a normal person.</p>
        </div>
    </div>
    <div class="input-bar">
        <input type="text" id="input" placeholder="Type a message..." autocomplete="off" autofocus>
        <button id="send" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://127.0.0.1:5000'
    : 'https://api.gudaoqihuo.com';

let userId = localStorage.getItem('maya_user_id') || ('web_' + Math.random().toString(36).slice(2,10));
localStorage.setItem('maya_user_id', userId);
let history = [];

const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const msgs = document.getElementById('messages');
const welcome = document.getElementById('welcome');

input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    sendBtn.disabled = true;

    if (welcome) welcome.remove();

    // user bubble
    addMsg('user', text);

    // typing indicator
    const typingEl = addTyping();

    try {
        const res = await fetch(API + '/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ message: text, user_id: userId, history: history.slice(-20) })
        });
        const data = await res.json();
        typingEl.remove();
        addMsg('maya', data.response);
        history.push({role:'user', content:text});
        history.push({role:'assistant', content:data.response});
        history = history.slice(-20);
    } catch (e) {
        typingEl.remove();
        addMsg('maya', "sorry, my brain's glitching. try again?");
    }
    sendBtn.disabled = false;
    input.focus();
}

function addMsg(who, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.innerHTML = `<div class="msg-avatar">${who === 'maya' ? 'M' : 'U'}</div><div class="msg-bubble">${escapeHtml(text)}</div>`;
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    return el;
}

function addTyping() {
    const el = document.createElement('div');
    el.className = 'msg maya';
    el.innerHTML = '<div class="msg-avatar">M</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    return el;
}

function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
